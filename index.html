<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logitrack-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiTrack</title>
    <script>
      // Apply the saved theme before the first paint so a reload never flashes the wrong colors
      try {
        if (localStorage.getItem('logitrack-theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (error) {}
    </script>
  </head>
  <body class="bg-cream font-sans text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
